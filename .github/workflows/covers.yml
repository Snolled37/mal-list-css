name: Refresh list CSS + profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 10:17 Bangkok time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build covers
        run: python scripts/build_covers.py --user Snolled
      - name: Build extras (progress, title/season/studio cards, frames, banners)
        # cached data/ means only new or stale titles/seasons/studios are fetched; cap requests per run
        run: python scripts/build_extras.py --user Snolled --max-fetch 60
      - name: Credits of newly completed titles (seiyuu, staff, theme songs)
        run: python scripts/fetch_credits.py --user Snolled --max-fetch 60
      - name: Verdana for the profile images (MAL's own font)
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ttf-mscorefonts-installer > /dev/null
          pip install -q pillow
      - name: Rebuild the daily profile cards (stats, this year, most watched)
        run: python scripts/build_profile.py --user Snolled --only-stats
      - name: Commit if changed
        run: |
          if git diff --quiet -- dist/ data/ && [ -z "$(git ls-files --others --exclude-standard data/ dist/)" ]; then
            echo "nothing changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/ data/
            git commit -m "Daily refresh: covers, extras, profile stats"
            git push
          fi
